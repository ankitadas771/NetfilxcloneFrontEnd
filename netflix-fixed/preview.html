<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — Netflix Clone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    .video-container {
      width: 100%;
      height: 100vh;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video controls autoplay muted>
      <source src="Intro-Netflix.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <a href="home.html" class="back-btn">&#8592; Back</a>
  </div>
</body>
</html>
