<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My List — Netflix Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mylist-body">

<!-- My List — Movies -->
<div class="mylist-row">
  <h1>Movies</h1>
  <div class="row_posters">
    <img src="Posters.1.jpg"  alt="Movie 1"  class="row__poster">
    <img src="Posters.2.jpg"  alt="Movie 2"  class="row__poster">
    <img src="Posters.3.jpg"  alt="Movie 3"  class="row__poster">
    <img src="Posters.4.jpg"  alt="Movie 4"  class="row__poster">
    <img src="Posters.5.jpg"  alt="Movie 5"  class="row__poster">
    <img src="Posters.6.jpg"  alt="Movie 6"  class="row__poster">
    <img src="Posters.7.jpg"  alt="Movie 7"  class="row__poster">
    <img src="Posters.8.jpg"  alt="Movie 8"  class="row__poster">
    <img src="Posters.9.jpg"  alt="Movie 9"  class="row__poster">
    <img src="Posters.10.jpg" alt="Movie 10" class="row__poster">
    <img src="MylistMovies10.jpg" alt="Movie 11" class="row__poster">
  </div>
</div>

<!-- My List — Series -->
<div class="mylist-row" style="margin-bottom: 60px;">
  <h1>Series</h1>
  <div class="row_posters">
    <img src="Series1.jpg"  alt="Series 1"  class="row__poster">
    <img src="Series2.jpg"  alt="Series 2"  class="row__poster">
    <img src="Series3.jpg"  alt="Series 3"  class="row__poster">
    <img src="Series4.jpg"  alt="Series 4"  class="row__poster">
    <img src="Series5.jpg"  alt="Series 5"  class="row__poster">
    <img src="Series6.jpg"  alt="Series 6"  class="row__poster">
    <img src="Series7.jpg"  alt="Series 7"  class="row__poster">
    <img src="Series8.jpg"  alt="Series 8"  class="row__poster">
    <img src="Series9.jpg"  alt="Series 9"  class="row__poster">
    <img src="Series10.jpg" alt="Series 10" class="row__poster">
  </div>
</div>

</body>
</html>
