<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone - Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #111;
    }

    .nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      z-index: 100;
      transition: all 0.5s ease-in;
      background-color: transparent;
    }

    .nav.nav__black {
      background-color: #111;
    }

    .nav__logo {
      width: 100px;
      object-fit: contain;
    }

    .nav__avatar {
      width: 50px;
      object-fit: contain;
    }

    .banner {
      background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5));
      background-size: cover;
      background-position: center;
      height: 700px;
      color: white;
      display: flex;
      align-items: center;
      padding-top: 100px;
    }

    .banner__contents {
      padding: 140px 30px;
      height: 190px;
    }

    .banner__title {
      font-size: 5rem;
      font-weight: 800;
      padding-bottom: 10px;
    }

    .banner__description {
      width: 70%;
      font-size: 1.2rem;
      line-height: 1.5;
      padding-top: 1rem;
      max-width: 500px;
    }

    .banner__button {
      padding: 1rem 2rem;
      margin: 1rem 1rem 1rem 0;
      background-color: rgba(51, 51, 51, 0.5);
      color: #fff;
      border: none;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background-color 0.3s, transform 0.2s;
    }

    .banner__button:hover {
      background-color: rgba(51, 51, 51, 0.8);
      transform: scale(1.05);
    }

    .row {
      color: white;
      margin-left: 20px;
      margin-top: 50px;
    }

    .row h2 {
      margin-bottom: 10px;
    }

    .row_posters {
      display: flex;
      overflow-x: auto;
      padding: 20px;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .row_posters::-webkit-scrollbar {
      display: none;
    }

    .row__poster {
      width: 200px;
      object-fit: contain;
      max-height: 300px;
      transition: transform 450ms;
      cursor: pointer;
      flex-shrink: 0;
    }

    .row__poster:hover {
      transform: scale(1.08);
    }
  </style>
</head>
<body>
  <!-- Nav bar -->
  <div class="nav" id="nav">
    <img src="netflix-logo.png" alt="Netflix Logo" class="nav__logo">
    <img src="netflix-avatar.png" alt="Avatar" class="nav__avatar">
  </div>

  <!-- Header/Banner -->
  <div class="banner">
    <div class="banner__contents">
      <h1 class="banner__title">Stranger Things</h1>
      <div>
        <button class="banner__button">▶ Play</button>
        <button class="banner__button">ℹ More Info</button>
      </div>
      <div class="banner__description">
        When a young boy vanishes, a small town uncovers a mystery involving secret experiments, terrifying supernatural forces and one strange little girl.
      </div>
    </div>
  </div>

  <!-- Netflix Originals -->
  <div class="row">
    <h2>NETFLIX ORIGINALS</h2>
    <div class="row_posters">
      <img src="Posters.1.jpg" alt="Movie 1" class="row__poster">
      <img src="Posters.2.jpg" alt="Movie 2" class="row__poster">
      <img src="Posters.3.jpg" alt="Movie 3" class="row__poster">
      <img src="Posters.4.jpg" alt="Movie 4" class="row__poster">
      <img src="Posters.5.jpg" alt="Movie 5" class="row__poster">
    </div>
  </div>

  <!-- Trending Now -->
  <div class="row">
    <h2>Trending Now</h2>
    <div class="row_posters">
      <img src="Romance-movies1.jpg" alt="Movie 1" class="row__poster">
      <img src="Romance-movies2.jpg" alt="Movie 2" class="row__poster">
      <img src="Romance-movies3.jpg" alt="Movie 3" class="row__poster">
      <img src="Romance-movies4.jpg" alt="Movie 4" class="row__poster">
      <img src="Romance-movies5.jpg" alt="Movie 5" class="row__poster">
    </div>
  </div>

  <!-- Top Searches -->
  <div class="row">
    <h2>Top Searches</h2>
    <div class="row_posters">
      <img src="Top-Searches1.jpg" alt="Search 1" class="row__poster">
      <img src="Top-Searches2.jpg" alt="Search 2" class="row__poster">
      <img src="Top-Searches3.jpg" alt="Search 3" class="row__poster">
      <img src="Top-Searches4.jpg" alt="Search 4" class="row__poster">
      <img src="Top-Searches5.jpg" alt="Search 5" class="row__poster">
    </div>
  </div>

  <!-- Series -->
  <div class="row" style="margin-bottom: 100px;">
    <h2>Popular Series</h2>
    <div class="row_posters">
      <img src="Series1.jpg" alt="Series 1" class="row__poster">
      <img src="Series2.jpg" alt="Series 2" class="row__poster">
      <img src="Series3.jpg" alt="Series 3" class="row__poster">
      <img src="Series4.jpg" alt="Series 4" class="row__poster">
      <img src="Series5.jpg" alt="Series 5" class="row__poster">
    </div>
  </div>

  <script>
    const nav = document.getElementById('nav');
    
    window.addEventListener('scroll', () => {
      if (window.scrollY >= 100) {
        nav.classList.add('nav__black');
      } else {
        nav.classList.remove('nav__black');
      }
    });
  </script>
</body>
</html>
